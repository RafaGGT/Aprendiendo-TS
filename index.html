<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto py-12 px-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-10">Carrito de Compras</h1>

        <div class="flex flex-col md:flex-row gap-6 justify-center max-w-4xl mx-auto">
            <!-- Formulario -->
            <div class="flex-1 bg-white rounded-xl shadow-md overflow-hidden">
                <div class="bg-blue-600 text-white font-semibold px-5 py-3">
                    Agregar Producto
                </div>
                <div class="p-5 flex flex-col gap-4">
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre del producto</label>
                        <input type="text" id="nombre" placeholder="Ej: Mouse inalámbrico"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="cantidad" class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
                        <input type="number" id="cantidad" placeholder="Ej: 2" min="1"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="precio" class="block text-sm font-medium text-gray-700 mb-1">Precio unitario</label>
                        <input type="number" id="precio" placeholder="Ej: 15000" min="0"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button id="agregar" onclick="agregarAlCarrito()"
                        class="mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg px-4 py-2 transition-colors">
                        Agregar al carrito
                    </button>
                </div>
            </div>

            <!-- Carrito -->
            <div class="flex-1 bg-white rounded-xl shadow-md overflow-hidden flex flex-col">
                <div class="bg-green-600 text-white font-semibold px-5 py-3 flex justify-between items-center">
                    <span>Carrito</span>
                    <button id="vaciar" onclick="vaciarCarrito()"
                        class="text-xs border border-white rounded px-2 py-1 hover:bg-green-700 transition-colors">
                        Vaciar
                    </button>
                </div>
                <div class="p-5 flex-1">
                    <ul id="carrito" class="divide-y divide-gray-200 max-h-64 overflow-y-auto"></ul>
                </div>
                <div class="border-t px-5 py-3 text-right bg-gray-50">
                    <h4 id="totalCarrito" class="font-bold text-green-600 text-lg">Total: $0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="container mt-8 max-w-md mx-auto p-4 text-center bg-rose-300 rounded-lg shadow-md">
<a href="index2.html" class="text-center text-black-500 hover:text-blue-700 mt-4">Ver errores</a>
</div>
<div class="container mt-8 max-w-md mx-auto p-4 text-center bg-sky-300 rounded-lg shadow-md">
<a href="index3.html" class="text-center text-black-500 hover:text-sky-700 mt-4">Listas y genericos</a>
</div>
    <script src="script1.js"></script>
</body>
</html>
